<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><meta name="theme-color" content="#3a7068"><title>손에 손잡고 | 사회복지법인 손과손 온라인 소식지</title><meta name="description" content="‘손에 손잡고’는 지적 장애인의 자립, 함께 사는 사회를 주제로 격월 제작하여 무료로 배포하는 소식지입니다."><meta name="naver-site-verification" content="33e5406be229561775255c9c6c9426327b1c921c"><meta property="og:type" content="article"><meta property="og:site_name" content="사회복지법인 손과손"><meta property="og:title" content="손에 손잡고 | 사회복지법인 손과손 온라인 소식지"><meta property="og:description" content="‘손에 손잡고’는 지적 장애인의 자립, 함께 사는 사회를 주제로 격월 제작하여 무료로 배포하는 소식지입니다."><link rel="canonical" href="https://webzine.yerim.or.kr/"><meta property="og:url" content="https://webzine.yerim.or.kr/"><meta property="og:image" content="https://webzine.yerim.or.kr/205/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"><link rel="preload" as="font" type="font/woff2" href="fonts/ft.woff2" crossorigin><script>try{var f=localStorage.getItem('fs');if(f>0)document.documentElement.className='fs'+f}catch(e){}</script><style>:root{--gb:#3a7068;--g:#3a7068;--gd:#2c554f;--gm:#9cb8b3;--gs:#c8d7d5;--gp:#ebf1f0}@font-face{font-family:"GD";src:url(fonts/ft.woff2) format("woff2");font-display:swap}/* 손에 손잡고 온라인판. 인쇄본의 제호·주제 색·꼭지 모양을 화면으로 옮긴다.
   주제 색은 호마다 다르다. render.py 의 theme() 이 표지 색 하나로 아래 여섯을 계산해 쪽 머리에 넣는다.
   --gb 표지 색 그대로(제호와 글자가 얹히지 않는 장식)  --g 글자·단추·흰 글자가 얹히는 바탕(대비 확보)
   --gd 더 진한 색  --gm 중간 옅은 색  --gs 옅은 색  --gp 아주 옅은 색 */
:root{
  --ink:#222;--sub:#565d5c;--rule:#8d9291;--hair:#d8dedd;--frame:#dcdcdc;--paper:#fff;--desk:#e3e9e7;--mark:#ffe27a;
  --gut:1.25rem;--ease:cubic-bezier(.16,1,.3,1);
  --sys:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:112.5%;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:4rem;scrollbar-color:var(--gm) transparent}
html.fs1{font-size:128.125%}
html.fs2{font-size:143.75%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sys);line-height:1.8;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,figure,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
img,svg{display:block}
img{max-width:100%;height:auto}
img.tall{object-position:50% 22%}
a{color:inherit;text-underline-offset:.18em}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
::selection{background:var(--gs);color:#111}
:focus-visible{outline:3px solid var(--g);outline-offset:3px;border-radius:.2rem}
.on-g :focus-visible{outline-color:#fff}
.ft{font-family:"GD",var(--sys)}
.fh{font-family:"Hand","GD",var(--sys)}
.fr{font-family:"Jua","GD",var(--sys)}
.fn{font-family:"DH","Jua",var(--sys)}
.fs{font-family:"GB",Georgia,"Nanum Myeongjo","AppleMyungjo",serif}
.nb{display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;left:.5rem;top:-4rem;z-index:99;padding:.6rem 1rem;border-radius:.6rem;background:var(--g);color:#fff;font-weight:700}
.skip:focus{top:.5rem}
.page{position:relative;max-width:45rem;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 2.5rem rgba(30,50,45,.07)}

/* 단추 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.9rem;padding:.45rem 1.1rem;border:1.5px solid var(--g);border-radius:.8rem;background:var(--paper);color:var(--g);font-weight:700;font-size:1rem;line-height:1.3;text-decoration:none;text-align:center;transition:background-color .2s,color .2s}
.btn.fill{background:var(--g);color:#fff}
.btn:active{background:var(--gp)}
.btn.fill:active{background:var(--gd)}
@media (hover:hover){.btn:hover{background:var(--gp)}.btn.fill:hover{background:var(--gd)}}

/* 위 띠: 차례·글자 크기 단추, 지금 읽는 꼭지 이름, 작은 제호(맨 위로) */
.bar{position:sticky;top:0;z-index:20;container-type:inline-size;display:flex;align-items:center;gap:.3rem;height:3.2rem;max-width:45rem;margin:0 auto;padding:0 .5rem;background:rgba(255,255,255,.97);box-shadow:0 1px 0 var(--hair);transition:background-color .3s,box-shadow .3s}
body.at-top .bar{background:transparent;box-shadow:none}
.bar-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:.25rem;min-width:2.75rem;height:2.6rem;padding:0 .6rem;border:1.5px solid var(--gs);border-radius:.7rem;background:var(--paper);color:var(--g);font-size:.95rem;font-weight:700;line-height:1}
.bar-btn small{font-size:.72em;margin-left:-.1rem}
.bar-btn:active{background:var(--gp)}
@media (hover:hover){.bar-btn:hover{background:var(--gp)}}
.bar-now{flex:1;min-width:0;padding-left:.3rem;font-size:min(1.32rem,5.6vw);line-height:1.2;color:#2a2a2a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-mast{flex:none;display:flex;align-items:center;width:3.6rem;height:2.75rem;padding:0 .15rem;transition:opacity .3s,visibility .3s}
.bar-mast svg{width:100%;height:auto;fill:var(--gb)}
body.at-top .bar-mast{opacity:0;visibility:hidden}
@container (max-width:19.4rem){.bar-mast{display:none}}

/* 차례 서랍 */
.menu{position:fixed;inset:0 auto 0 0;z-index:40;width:min(88vw,23rem);height:100%;margin:0;overflow:auto;overscroll-behavior:contain;background:var(--paper);box-shadow:.4rem 0 1.6rem rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.menu[open]{animation:slide .34s var(--ease)}@keyframes slide{from{transform:translateX(-100%)}}}
.menu-top{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:.5rem .5rem .5rem 1.2rem;background:var(--paper);border-bottom:2px solid var(--g)}
.menu-top h2{font-weight:400;font-size:1.25rem;line-height:1.3;color:var(--g)}
.menu-top h2 small{margin-left:.4rem;font-family:var(--sys);font-size:.72em;color:var(--sub)}
.menu-top button{display:grid;place-items:center;width:2.9rem;height:2.9rem;border:0;border-radius:50%;background:none;color:#444}
.menu-list{padding:.3rem 1.2rem 0}
.menu-list>li{padding:.12rem 0;border-bottom:1px solid var(--hair)}
.menu-list>li>a{display:flex;align-items:center;gap:.7rem;min-height:3.1rem;text-decoration:none;font-size:1.15rem;line-height:1.3}
.menu-list .n{flex:none;min-width:1.6rem;color:var(--g)}
.menu-list ul{padding:0 0 .5rem 2.3rem}
.menu-list ul a{display:flex;align-items:center;min-height:2.75rem;padding:.2rem 0;text-decoration:none;color:#444;font-size:1rem;line-height:1.4}
.menu-list a[aria-current]{color:var(--g);font-weight:700}
.menu-list a:active{background:var(--gp)}
.menu-etc{display:grid;gap:.5rem;padding:1.2rem 1.2rem 2.4rem}

/* 표지 — 인쇄본 1면 */
.cover{position:relative;margin-top:-3.2rem}
.tagline{position:absolute;top:0;right:0;padding:.3rem .9rem .34rem;background:var(--g);color:#fff;font-size:.74rem;line-height:1.5}
.tagline b{font-style:italic;font-weight:800;margin-right:.35rem}
.cover-head{display:flex;align-items:flex-end;justify-content:space-between;gap:.75rem;padding:5rem var(--gut) 1.35rem}
.mast{flex:0 1 61%;min-width:0;line-height:0}
.mast svg{width:100%;height:auto;aspect-ratio:312/122;fill:var(--gb)}
.cover-date{flex:none;display:grid;justify-items:end;gap:.45rem;color:var(--g)}
.cover-date .ym{font-size:1.4rem;line-height:1;letter-spacing:.04em;white-space:nowrap}
.cover-date .ym b{font-weight:400;font-size:2.6rem;letter-spacing:0;margin-left:.04em}
.cover-date .no{padding:.16rem .85rem .18rem;background:var(--g);color:#fff;font-size:.85rem;font-weight:700;line-height:1.4;white-space:nowrap}
.cover-photo img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--gp)}
.cover-photo figcaption{padding:.6rem var(--gut) 0;font-size:.8rem;line-height:1.55;color:var(--sub)}
@media (prefers-reduced-motion:no-preference){
  .mast svg{animation:brush .9s var(--ease) .05s backwards}
  @keyframes brush{from{clip-path:inset(-5% 100% -5% 0)}to{clip-path:inset(-5% -2% -5% 0)}}
}

/* 차례 — 인쇄본 2면 */
.toc{padding:1.9rem var(--gut) 2.4rem}
.toc-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.toc-photos img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:.35rem 1.25rem;background:var(--gp)}
.toc-no{margin-top:1rem;padding-bottom:.45rem;border-bottom:1.5px solid var(--rule);text-align:right;font-size:.92rem;line-height:1.3;color:#333}
.toc-no b{font-size:1.55rem;font-weight:400}
.contents{display:flex;align-items:baseline;gap:.05em;margin:1.5rem 0 .5rem;font-size:2.75rem;line-height:1;color:var(--g);white-space:nowrap}
.contents span:nth-child(2),.contents span:nth-child(5),.contents span:nth-child(8){font-size:.74em}
.contents span:nth-child(2),.contents span:nth-child(5),.contents span:nth-child(6){opacity:.7}
.contents span:nth-child(3),.contents span:nth-child(8){opacity:.84}
.toc-list a{display:flex;align-items:center;gap:.8rem;min-height:3.1rem;padding:.3rem .15rem;border-bottom:1px solid var(--hair);text-decoration:none;font-size:1.2rem;line-height:1.35}
.toc-list .n{flex:none;min-width:1.75rem;color:var(--g);font-size:1.15rem}
.toc-list .ic{margin-left:auto;color:var(--gm)}
.toc-list a:active{background:var(--gp)}
@media (hover:hover){.toc-list a:hover{background:var(--gp)}}
.about{margin-top:1.6rem;font-size:1rem;line-height:1.75;color:#333}
.about b{font-weight:700;color:var(--g)}
.toc-btns{display:grid;gap:.5rem;margin-top:1.4rem}

/* 꼭지 머리 — 인쇄본 쪽 위 손글씨 꼭지 이름과 쪽 번호표 */
.sec{position:relative;border-top:.6rem solid var(--gp)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.6rem 0 .1rem var(--gut)}
.sec-head h2{position:relative;padding-left:.85rem;font-size:2.05rem;line-height:1.15;font-weight:400;color:#2a2a2a}
.sec-head h2::before{content:"";position:absolute;left:0;top:.18em;bottom:.14em;width:.2rem;background:var(--ink)}
.pg{flex:none;min-width:3rem;padding:.28rem .7rem .3rem .8rem;background:var(--g);color:#fff;font-size:.95rem;line-height:1.3;text-align:center}

/* 듣기 */
.listen{display:inline-flex;align-items:center;gap:.4rem;min-height:2.75rem;padding:.3rem 1rem .3rem .75rem;border:1.5px solid var(--g);border-radius:99px;background:var(--paper);color:var(--g);font-size:.95rem;font-weight:700;line-height:1.2;text-decoration:none;transition:background-color .2s,color .2s}
.listen .t{font-weight:400;font-variant-numeric:tabular-nums;font-size:.86em}
.listen.on{background:var(--g);color:#fff}
.listen .ic{stroke-width:2.1}
.listen-row{display:flex;justify-content:center;margin:.9rem 0 1rem}

/* 기사 — 인쇄본 4~7면 */
.art{padding:1.7rem var(--gut) 2rem}
.art+.art{border-top:1px dashed var(--gm)}
.art h3,.tbl h3{font-weight:400;color:var(--g);font-size:1.5rem;line-height:1.35;letter-spacing:-.01em;text-align:center;text-wrap:balance}
.art h3 b,.tbl h3 b{font-weight:400}
.art h3.two{color:#333}
.art h3.two b{color:var(--g)}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:.05rem 1.1rem;margin-top:.65rem;padding:.45rem 0;border-top:2px solid var(--rule);border-bottom:1px solid #c9cdcc;font-size:.92rem;line-height:1.55;color:#333}
.meta div{display:flex;gap:.35em}
.meta dt::before{content:"";display:inline-block;width:0;height:0;margin-right:.4em;border-left:.5em solid currentColor;border-top:.3em solid transparent;border-bottom:.3em solid transparent}
.meta dt::after{content:" :"}
.body{line-height:1.9}
.body p{text-indent:1em;text-wrap:pretty}   /* 마지막 줄에 낱말 하나만 떨어지지 않게(되는 브라우저에서만) */
.body p+p{margin-top:.2rem}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:1.1rem}
.ph{position:relative;display:block;padding:.26rem;background:var(--frame);border-radius:.8rem;line-height:0}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:.56rem;background:#eceeee;transition:filter .2s}
.ph:focus-visible{outline-offset:1px;border-radius:.8rem}
@media (hover:hover){.ph:hover img{filter:brightness(1.06)}}
.gal.n5 .ph:first-child,.gal.n3 .ph:first-child{grid-column:span 2}
.gal.n5 .ph:first-child img,.gal.n3 .ph:first-child img{aspect-ratio:16/9}

/* 기고 — 인쇄본 3면 */
.essay{--blob:#f2f3f3;position:relative;padding:1.8rem var(--gut) 2.2rem;overflow:hidden;background:
  radial-gradient(circle at 93% 2%,var(--blob) 0 3.4rem,transparent 5.4rem),
  radial-gradient(circle at 3% 27%,var(--blob) 0 2.2rem,transparent 3.9rem),
  radial-gradient(circle at 98% 61%,var(--blob) 0 3.6rem,transparent 5.9rem),
  radial-gradient(circle at 6% 90%,var(--blob) 0 2.8rem,transparent 4.8rem)}
@supports (color:color-mix(in srgb,red,blue)){.essay{--blob:color-mix(in srgb,var(--gp) 55%,#f3f3f3)}}
.essay h3{position:relative;padding-left:1.05rem;font-weight:400;line-height:1.3}
.essay h3::before{content:"";position:absolute;left:0;top:.2rem;bottom:.2rem;width:.42rem;background:var(--rule)}
.essay h3 span{display:block;font-size:1.4rem;color:#444}
.essay h3 b{display:block;font-weight:400;font-size:2rem;color:var(--g)}
.sprout{position:absolute;top:1.1rem;right:.9rem;width:5.4rem;height:auto;color:#a9afae;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round}
.who{display:flex;align-items:center;gap:1rem;margin:1.5rem 0 .3rem}
.who .ph{flex:none;width:6.4rem}
.who .ph img,.who .ph img.tall{aspect-ratio:1/1;object-position:50% 30%}
.who p{font-size:1rem;line-height:1.5}
.who b{display:block;font-size:1.15rem;letter-spacing:.32em}
.essay .listen-row{justify-content:flex-start}
.essay .lead{font-weight:700;margin-bottom:.35rem}
.essay .note{margin-top:1.4rem;text-align:right;font-size:.92rem;color:#444}

/* 사진으로 보는 손과손 — 인쇄본 8·9면 */
.story{background-color:var(--gm);border-top:0;background-image:linear-gradient(90deg,rgba(255,255,255,.08) 50%,transparent 0),linear-gradient(rgba(255,255,255,.08) 50%,transparent 0);background-size:14px 14px}
.story .sec-head{justify-content:flex-end;padding-bottom:0}
.story-title{position:relative;padding:.9rem var(--gut) 2rem}
.story-title p{font-weight:400;color:#fff;line-height:1.12;transform:rotate(-5deg);transform-origin:0 100%;-webkit-text-stroke:.34rem var(--gd);paint-order:stroke fill;text-shadow:0 .22rem 0 var(--gd)}
.story-title span{display:block;font-size:1.6rem}
.story-title b{display:block;font-weight:400;font-size:2.7rem;letter-spacing:.01em}
.story-title .cam{position:absolute;right:.9rem;top:-.2rem;width:5.2rem;height:auto;color:var(--gd);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transform:rotate(8deg)}
.story .listen-row{justify-content:flex-start;margin:0 var(--gut) .4rem}
.story .listen{border-color:var(--gd);color:var(--gd)}
.story .listen.on{background:var(--gd);color:#fff}
.group{padding:1.4rem var(--gut) 2.2rem}
.group:nth-of-type(even){background-color:var(--gs);background-image:inherit;background-size:inherit}
.group h4{font-weight:400;font-size:1.85rem;line-height:1.2;color:#fff;-webkit-text-stroke:.3rem var(--gd);paint-order:stroke fill}
.group:nth-of-type(even) h4{text-align:right}
.st{width:86%;margin-top:1.5rem}
.st:nth-of-type(even){margin-left:auto}
.st-frame{display:block;filter:drop-shadow(0 .2rem .3rem rgba(25,50,45,.28));transform:rotate(-1.2deg);transition:transform .35s var(--ease)}
.st:nth-of-type(even) .st-frame{transform:rotate(1.2deg)}
.stamp{--r:.3rem;display:block;padding:.66rem;background:#fff;line-height:0;
  -webkit-mask:linear-gradient(#000 0 0) center/calc(100% - var(--r)*2) calc(100% - var(--r)*2) no-repeat,
    radial-gradient(circle at 50% 0,#0000 calc(var(--r)*.6),#000 calc(var(--r)*.6 + .5px)) 0 0/calc(var(--r)*2) var(--r) round no-repeat,
    radial-gradient(circle at 50% 100%,#0000 calc(var(--r)*.6),#000 calc(var(--r)*.6 + .5px)) 0 100%/calc(var(--r)*2) var(--r) round no-repeat,
    radial-gradient(circle at 0 50%,#0000 calc(var(--r)*.6),#000 calc(var(--r)*.6 + .5px)) 0 0/var(--r) calc(var(--r)*2) no-repeat round,
    radial-gradient(circle at 100% 50%,#0000 calc(var(--r)*.6),#000 calc(var(--r)*.6 + .5px)) 100% 0/var(--r) calc(var(--r)*2) no-repeat round;
  mask:linear-gradient(#000 0 0) center/calc(100% - var(--r)*2) calc(100% - var(--r)*2) no-repeat,
    radial-gradient(circle at 50% 0,#0000 calc(var(--r)*.6),#000 calc(var(--r)*.6 + .5px)) 0 0/calc(var(--r)*2) var(--r) round no-repeat,
    radial-gradient(circle at 50% 100%,#0000 calc(var(--r)*.6),#000 calc(var(--r)*.6 + .5px)) 0 100%/calc(var(--r)*2) var(--r) round no-repeat,
    radial-gradient(circle at 0 50%,#0000 calc(var(--r)*.6),#000 calc(var(--r)*.6 + .5px)) 0 0/var(--r) calc(var(--r)*2) no-repeat round,
    radial-gradient(circle at 100% 50%,#0000 calc(var(--r)*.6),#000 calc(var(--r)*.6 + .5px)) 100% 0/var(--r) calc(var(--r)*2) no-repeat round}
.stamp img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eceeee}
@media (hover:hover){.st-frame:hover{transform:rotate(0) scale(1.015)}}
.st-cap{margin-top:.8rem;font-size:1.05rem;line-height:1.4;color:#16211f}
.st-cap b{display:block;font-weight:400;font-size:1.8rem;line-height:1.1;color:var(--gd)}
.st:nth-of-type(even) .st-cap{text-align:right}

/* 후원자 명단 — 인쇄본 10면 */
.band-title{display:flex;align-items:center;gap:.8rem;padding:1.9rem var(--gut) .5rem}
.band-title h3{font-weight:400;font-size:2.2rem;line-height:1.12;color:#444}
.band-title h3 b{font-weight:400;font-size:1.3em;color:var(--g)}
.band-title svg{flex:none;width:4.4rem;height:auto;margin-left:auto;color:var(--gb);fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.band-title svg .fill{fill:currentColor;stroke:none}
.when{margin:-.1rem var(--gut) 0;font-size:1.55rem;line-height:1.2;color:#555}
.dot{position:relative;margin:1.5rem var(--gut) .55rem;padding-left:1.1rem;font-size:1.05rem;font-weight:800;line-height:1.5}
.dot::before{content:"";position:absolute;left:0;top:.48em;width:.62rem;height:.62rem;border-radius:50%;background:var(--gb)}
.finder{display:flex;align-items:center;gap:.6rem;margin:.7rem var(--gut) 0}
.finder label{position:relative;flex:1;min-width:0}
.finder .ic{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--g);pointer-events:none}
.finder input{width:100%;height:2.9rem;padding:0 .9rem 0 2.6rem;border:1.5px solid var(--gm);border-radius:.8rem;font:inherit;font-size:1rem;background:var(--paper);color:var(--ink);caret-color:var(--g);-webkit-appearance:none;appearance:none}
.finder input::placeholder{color:#6a7170}
.finder input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;width:1.3rem;height:1.3rem;background:var(--g);cursor:pointer;-webkit-mask:linear-gradient(45deg,#0000 44%,#000 44% 56%,#0000 56%),linear-gradient(-45deg,#0000 44%,#000 44% 56%,#0000 56%);mask:linear-gradient(45deg,#0000 44%,#000 44% 56%,#0000 56%),linear-gradient(-45deg,#0000 44%,#000 44% 56%,#0000 56%)}
.finder input:focus-visible{border-color:var(--g);outline-offset:0}
.finder output{flex:none;font-size:.95rem;color:var(--g);font-weight:700;white-space:nowrap}
.names{position:relative;margin:1.2rem var(--gut) 0;padding:0 .95rem 1rem 0;border-right:1.5px dashed var(--gb);border-bottom:1.5px dashed var(--gb)}
.names::after{content:"";position:absolute;right:-.42rem;top:-.15rem;width:.75rem;height:.75rem;background:var(--gb);transform:rotate(45deg) scale(.68,1)}
.names h4{font-size:1.08rem;color:var(--g);font-weight:800;line-height:1.5}
.names h4::before{content:"– "}
.names h4 small{font-weight:400;font-size:.8em;color:var(--sub)}
.names ul{display:flex;flex-wrap:wrap;gap:0 .8em;margin-top:.25rem;font-size:1rem;line-height:2.05}
.names li{white-space:nowrap;border-radius:.25rem}
.names li.hit{background:var(--mark);box-shadow:0 0 0 .22rem var(--mark);font-weight:700}
.names.fold ul{max-height:12.3em;overflow:hidden;-webkit-mask:linear-gradient(#000 70%,#0000);mask:linear-gradient(#000 70%,#0000)}
.names .more{display:none;margin:.5rem auto 0}
.names.fold .more{display:flex}

/* 자원봉사·후원물품 — 인쇄본 11면 */
.thanks{padding-bottom:1.9rem}
.vols{display:grid;gap:1.1rem .7rem;margin:.8rem var(--gut) 0}
.vols .pair{display:grid;grid-template-columns:1fr 1fr;gap:.3rem}
.vols .ph{padding:0;background:none;border-radius:.75rem}
.vols .ph img{aspect-ratio:3/2;border-radius:.75rem}
.vols figcaption{margin-top:.35rem;text-align:center;font-size:1rem;line-height:1.4}
.goods{margin:1rem var(--gut) 0}
.goods h4{padding:.35rem;background:var(--gp);border-top:2.5px solid var(--gs);border-bottom:1px solid var(--gs);text-align:center;font-size:1rem;font-weight:800;line-height:1.5}
.goods dl>div{display:flex;gap:.9rem;padding:.55rem .15rem;border-bottom:1px solid var(--hair);font-size:1rem;line-height:1.5}
.goods dt{flex:0 0 42%;color:var(--g);font-weight:800}
.goods dd{flex:1}
.goods p{position:relative;padding:.6rem .15rem .1rem 1.1rem;font-size:1rem;line-height:1.6}
.goods p::before{content:"";position:absolute;left:.1rem;top:1.12em;width:.6rem;height:.6rem;border-radius:50%;background:var(--gb)}
.goods p b{font-weight:800}
.omit{display:flex;flex-wrap:wrap;gap:.9rem;margin:1.7rem var(--gut) 0;padding:1.1rem;border-radius:.9rem;background:#f3f5f5;font-size:.95rem;line-height:1.7}
.omit>svg{flex:none;width:2.5rem;height:2.5rem;color:var(--rule);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.omit>div{flex:1 1 12rem;min-width:0}
.omit .ask{margin-top:.6rem;font-weight:700}
.tel{display:inline-flex;flex-wrap:wrap;align-items:center;gap:0 .3rem;min-height:2.75rem;font-weight:800;font-size:1.05em;white-space:nowrap;text-decoration:none;color:var(--g)}
.tel small{font-weight:400;font-size:.8em;color:var(--sub)}
.omit .tels{display:flex;flex-wrap:wrap;gap:0 1.2rem}

/* 후원 안내 — 인쇄본 12면 */
.give-wrap{padding:1.1rem .8rem 1.2rem;background:var(--gb)}
.give{padding:1.6rem 1.1rem 1.7rem;border-radius:1.1rem;background:var(--gp)}
.give-title{text-align:center;font-weight:400;font-size:1.3rem;line-height:1.35;color:#222;text-wrap:balance}
.give-title b{font-weight:400;font-size:1.5em;color:var(--g);margin:0 .08em}
.kinds{margin-top:1.2rem}
.kinds>div{display:flex;align-items:center;gap:.75rem;padding:.45rem 0;border-bottom:1.5px solid #333}
.kinds>div:first-child{border-top:1.5px solid #333}
.kinds dt{flex:none;width:5.8rem;padding:.22rem 0;border-radius:.3rem;background:var(--g);color:#fff;text-align:center;font-size:.95rem;font-weight:700;line-height:1.4}
.kinds dd{font-size:1rem;line-height:1.5}
.three{display:grid;grid-template-columns:repeat(3,1fr);margin-top:1.1rem}
.three li{padding:.2rem .4rem;border-left:1.5px solid var(--rule);text-align:center;font-size:.9rem;line-height:1.5}
.three li:last-child{border-right:1.5px solid var(--rule)}
.three svg{width:2.3rem;height:2.3rem;margin:0 auto .2rem;color:var(--g);fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.three b{display:block;font-size:1.02rem;margin-bottom:.25rem}
.give-h{margin-top:1.8rem;font-size:1.12rem;font-weight:400;line-height:1.4}
.give-h b{font-size:1.2em;font-weight:800;color:var(--g)}
.give-sub{margin-top:.5rem;font-size:1rem;font-weight:800}
.give-list li{position:relative;padding-left:.85rem;font-size:1rem;line-height:1.75}
.give-list li::before{content:"";position:absolute;left:.15rem;top:.82em;width:.22rem;height:.22rem;border-radius:50%;background:currentColor}
.give-list b{font-weight:700}
.give-list b::after{content:" :"}
.acct{margin-top:1rem}
.acct h5{margin:0;font-size:1.08rem;color:var(--g);font-weight:800;line-height:1.5}
.acct h5 small{font-weight:400;font-size:.8em;color:#333;white-space:nowrap}
.acct li{display:flex;align-items:center;gap:.4rem;padding:.22rem 0;border-bottom:1px solid var(--gs);font-size:1rem}
.acct li span{flex:0 0 3.1rem;color:#333}
.acct li b{flex:1;font-weight:500;font-size:min(1em,4.1vw);font-variant-numeric:tabular-nums}
.acct button{flex:none;display:inline-flex;align-items:center;gap:.25rem;min-height:2.75rem;padding:0 .6rem;border:1px solid var(--g);border-radius:.6rem;background:var(--paper);color:var(--g);font-size:.88rem;font-weight:700}
.acct button:active{background:var(--gs)}
/* 글자를 키우면 번호가 두 줄로 꺾이므로, 은행 이름·복사 단추를 윗줄에 두고 번호는 아랫줄에 통째로 둔다 */
.fs1 .acct li,.fs2 .acct li{flex-wrap:wrap;padding:.4rem 0}
.fs1 .acct li span,.fs2 .acct li span{flex:1}
.fs1 .acct li b,.fs2 .acct li b{order:1;flex:0 0 100%;font-size:min(1.1em,6.2vw);white-space:nowrap}
.tax{margin-top:1.1rem;padding:.85rem 1rem;border-radius:.7rem;background:var(--gs);font-size:.92rem;line-height:1.65}
.give-btns{display:grid;gap:.5rem;margin-top:1.1rem}

/* 알림(김장 나눔 등) — 인쇄본 12면 아래 */
.notice{padding:2rem var(--gut) 2.2rem}
.notice h3{font-weight:400;font-size:2.15rem;line-height:1.2;color:#333;transform:rotate(-1.5deg);transform-origin:0 50%}
.notice h3 b{font-weight:400;color:var(--g)}
.notice .slogan{margin:.9rem 0 .2rem;font-size:2.05rem;line-height:1.25;color:#3c3c3c;letter-spacing:.02em}
.notice .listen-row{justify-content:flex-start}
.notice .body p{text-indent:0}
.notice .ask{display:flex;flex-wrap:wrap;align-items:center;gap:0 .9rem;margin-top:1.2rem;padding:.5rem 1rem;background:var(--gp);color:var(--g);font-weight:800}
.notice .gal{grid-template-columns:repeat(3,1fr)}
.notice .gal .ph img{aspect-ratio:1/1}

/* 표(결산·후원금 수입과 사용 결과 등) */
.tbl{padding:1.7rem var(--gut) 2rem}
.tbl+.tbl,.art+.tbl,.tbl+.art{border-top:1px dashed var(--gm)}
.tbl .unit{margin-top:.5rem;text-align:right;font-size:.88rem;color:var(--sub)}
.tbl-scroll{margin-top:.5rem;overflow-x:auto;border-top:2px solid var(--rule);-webkit-overflow-scrolling:touch}
.tbl table{min-width:100%;border-collapse:collapse;font-size:.95rem;line-height:1.5;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:.5rem .7rem;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
.tbl thead th{background:var(--gp);text-align:center;font-weight:800}
.tbl tbody th{text-align:left;font-weight:700;color:var(--g)}

/* 발행 정보 — 인쇄본 2면 아래 */
.foot{padding:1.8rem var(--gut) 2.6rem;border-top:.6rem solid var(--gp)}
.pub{padding:1.3rem 1.2rem;border-radius:1.1rem;background:var(--gp);font-size:.95rem;line-height:1.8}
.pub svg{width:11.5rem;height:auto;margin-bottom:.9rem}
#logo .a{fill:var(--gb)}#logo .b{fill:var(--gm)}#logo .c{fill:#fff}
.pub ul+ul{margin-top:.7rem;padding-top:.7rem;border-top:2px solid #fff}
.pub ul+ul li{position:relative;padding-left:.9rem}
.pub ul+ul li::before{content:"";position:absolute;left:0;top:.72em;width:.42rem;height:.42rem;background:var(--gb)}
.pub a{display:inline-block;min-height:2.75rem;line-height:2.75rem;text-underline-offset:.2em}   /* 손가락으로 누르기 쉬운 높이 */
.foot-links{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:1.1rem}
.foot-links .btn{padding-inline:.5rem}   /* 좁은 화면(360)에서 단추 글자가 두 줄로 꺾이지 않게 */
.sns{margin-top:1.5rem}
.sns h3{font-size:1rem;font-weight:700;color:#333;text-align:center}
.sns .foot-links{margin-top:.6rem}
.sns a:last-child:nth-child(odd){grid-column:1/-1}
.love{margin-top:1.5rem;text-align:center;font-size:.88rem;color:var(--sub)}
.love b{font-style:italic;font-weight:800;color:#222;margin-right:.4rem}

/* 듣기 띠(아래에 붙는다) */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:.35rem;max-width:45rem;margin:0 auto;padding:.45rem .5rem calc(.45rem + env(safe-area-inset-bottom));background:var(--gd);color:#fff;box-shadow:0 -.2rem .9rem rgba(0,0,0,.2)}
.player button{flex:none;display:grid;place-items:center;width:2.9rem;height:2.9rem;border:0;border-radius:50%;background:none;color:#fff}
.player .pp{background:#fff;color:var(--gd)}
.player .pp .ic{stroke-width:2.2}
.player button:active{opacity:.75}
.player :focus-visible{outline-color:#fff}
.player-info{flex:1;min-width:0;padding:0 .35rem;line-height:1.3}
.player-info b{display:block;font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-info span{font-size:.86rem;font-variant-numeric:tabular-nums;opacity:.9}
.player progress{position:absolute;left:0;right:0;top:-3px;width:100%;height:3px;border:0;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.25)}
.player progress::-webkit-progress-bar{background:rgba(255,255,255,.25)}
.player progress::-webkit-progress-value{background:var(--mark)}
.player progress::-moz-progress-bar{background:var(--mark)}
body.playing{padding-bottom:4.2rem}

/* 대화상자(차례 서랍·사진 크게 보기) */
dialog{display:none;padding:0;border:0;max-width:none;max-height:none;color:inherit}
dialog[open]{display:block}
dialog::backdrop{background:rgba(15,25,23,.5)}
.lb{position:fixed;inset:0;z-index:50;width:100%;height:100%;margin:0;background:#0b0f0e;color:#fff}
.lb-track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.lb-track::-webkit-scrollbar{display:none}
.lb-track figure{flex:0 0 100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always;padding:3.6rem 0 4.6rem}
.lb-track img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:center/contain no-repeat}
.lb button{position:absolute;display:grid;place-items:center;width:3rem;height:3rem;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff}
.lb :focus-visible{outline-color:#fff}
.lb-x{top:.5rem;right:.5rem}
.lb-prev,.lb-next{top:50%;margin-top:-1.5rem;display:none!important}
.lb-prev{left:.6rem}.lb-prev .ic{transform:scaleX(-1)}.lb-next{right:.6rem}
.lb-cap{position:absolute;left:1rem;right:1rem;bottom:calc(.9rem + env(safe-area-inset-bottom));text-align:center;font-size:1rem;line-height:1.5;text-wrap:balance}
.lb-cap b{display:block;font-weight:400;font-variant-numeric:tabular-nums;opacity:.8;font-size:.9rem}
.lb-ttl{position:absolute;left:1rem;right:4rem;top:1.05rem;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover) and (min-width:48rem){.lb-prev,.lb-next{display:grid!important}}
@media (prefers-reduced-motion:no-preference){.lb{animation:fade .25s var(--ease)}@keyframes fade{from{opacity:0}}}
.toast{position:fixed;left:50%;bottom:5.2rem;z-index:60;transform:translateX(-50%);max-width:calc(100% - 2rem);padding:.65rem 1.15rem;border-radius:99px;background:rgba(20,30,28,.94);color:#fff;font-size:1rem;line-height:1.4;text-align:center}

/* 인쇄본 보기 · 지난 호 */
.plain-head{padding:1.6rem var(--gut) 1.1rem;text-align:center}
.plain-head .mast{display:inline-block;width:10rem}
.plain-head .mast svg{animation:none}
.plain-head h1{margin-top:.9rem;font-weight:400;font-size:1.5rem;line-height:1.35;color:var(--g)}
.plain-head p{margin-top:.3rem;font-size:1rem;color:var(--sub)}
.plain-head .btn{margin-top:1rem}
.sheets{padding:0 0 2.5rem;background:var(--desk)}
.sheets img{width:100%;margin-top:.6rem;background:#fff}
.sheets p{padding:1.2rem var(--gut) 0;text-align:center}
.issues{display:grid;gap:1rem;padding:.4rem var(--gut) 2.6rem}
.issues a{display:flex;gap:1rem;align-items:center;padding:.85rem;border:1px solid var(--hair);border-radius:1.1rem;text-decoration:none;background:var(--paper)}
.issues a:active{background:var(--gp)}
@media (hover:hover){.issues a:hover{background:var(--gp)}}
.issues img{flex:none;width:7rem;aspect-ratio:4/3;object-fit:cover;border-radius:.6rem;background:var(--gp)}
.issues b{display:block;font-weight:400;font-size:1.3rem;line-height:1.35;color:var(--g)}
.issues span{display:block;margin-top:.25rem;font-size:.95rem;line-height:1.55;color:var(--sub)}

@media (min-width:40rem){
  :root{--gut:2.1rem}
  .cover-head{padding-top:5.5rem;padding-bottom:1.7rem}
  .gal.n4,.gal.n8{grid-template-columns:repeat(4,1fr)}
  .gal.n6,.gal.n5,.gal.n3{grid-template-columns:repeat(3,1fr)}
  .gal.n5 .ph:first-child,.gal.n3 .ph:first-child{grid-column:auto}
  .gal.n5 .ph:first-child img,.gal.n3 .ph:first-child img{aspect-ratio:4/3}
  .notice .gal{grid-template-columns:repeat(5,1fr)}
  .vols{grid-template-columns:1fr 1fr}
  .group{display:grid;grid-template-columns:1fr 1fr;gap:0 1.4rem;align-items:start}
  .group h4{grid-column:1/-1}
  .st{width:auto}
  .st:nth-of-type(even){margin-top:3.2rem}
  .give-wrap{padding:1.7rem}
  .give{padding:2rem 1.9rem}
  .give-btns,.toc-btns{grid-template-columns:1fr 1fr}
  .names.fold ul{max-height:8.2em}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  .bar,.menu,.listen-row,.player,.toc-btns,.foot-links,.sns,.finder,.more,.give-btns,.skip,.lb{display:none!important}
  .cover{margin-top:0}
  body{background:#fff}.page{max-width:none}.names.fold ul{max-height:none;-webkit-mask:none;mask:none}
  .art,.st,.vols figure{break-inside:avoid}
}
